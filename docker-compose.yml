services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  frontend:
    build: ./frontend
    environment:
      - BACKEND_URL=http://backend:8000

  backend:
    build: ./backend
    environment:
      - FHIR_DATA_PATH=/app/data/fhir
      - LLM_PROVIDER=${LLM_PROVIDER:-stub}
      - OLLAMA_BASE_URL=http://ollama:11434
      - AUTH_DISABLED=${AUTH_DISABLED:-true}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./data:/app/data:ro

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
